<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diablo 4 Build Advisor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #e9dfc9;
    --fg: #221b13;
    --fg-dim: #75634c;
    --gold: #8a6410;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a08;
      --fg: #ece1cb;
      --fg-dim: #8d7c65;
      --gold: #d5aa4a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino,
                 Georgia, "Times New Roman", serif;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 32rem; }
  p {
    color: var(--fg-dim);
    font-size: 1.15rem;
    margin: 0;
    border-top: 2px solid var(--gold);
    padding-top: 1rem;
  }
</style>
</head>
<body>
<main>
  <p>Diablo 4 Build Advisor — site under construction</p>
</main>
</body>
</html>
